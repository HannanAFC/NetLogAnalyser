services:

  frontend:
    build: ./frontend
    container_name: NetLogAnalyser-Frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - NetLogAnalyser-Network
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CI=true
      - NODE_ENV=development
    command: sh /entrypoint.sh
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: NetLogAnalyser-Backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - NetLogAnalyser-Network
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: NetLogAnalyser-DB
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - NetLogAnalyser-Network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:18-alpine
    container_name: NetLogAnalyser-TestDB
    environment:
      - POSTGRES_USER=NetlogAnalyserUserTest
      - POSTGRES_PASSWORD=TestPass
      - POSTGRES_DB=NetLogAnalyserDBTest
    ports:
      - "5433:5432"
    networks:
      - NetLogAnalyser-Network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: NetLogAnalyser-Redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - NetLogAnalyser-Network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
  redis_data:

networks:
  NetLogAnalyser-Network:
    driver: bridge