services:
  frontend:
    build: ./frontend
    container_name: NetLogAnalyser-Frontend
    ports:
      - "5174:5174"
    environment:
     - BUILD_MODE=${BUILD_MODE}
    depends_on:
      - backend
    networks:
      - NetLogAnalyser-Network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh /entrypoint.sh

  backend:
    build: ./backend
    container_name: NetLogAnalyser-Backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BUILD_MODE=${BUILD_MODE}
    depends_on:
      - db
    volumes:
      - ./:/workspaces
    networks:
      - NetLogAnalyser-Network

  db:
    image: postgres:18-alpine
    container_name: NetLogAnalyser-DB
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - NetLogAnalyser-Network

volumes:
  postgres_data:

networks:
  NetLogAnalyser-Network:
    driver: bridge