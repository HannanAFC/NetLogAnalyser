name: Tests

on:
  workflow_call:

jobs:
  backend-tests:
    if: |
      !(
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'docs')) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'docs')) ||
        (github.event_name == 'pull_request' && contains(github.event.head_commit.message, '[skip-tests]')) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip-tests]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: TESTING_KEY
      DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest
      REDIS_URL: redis://localhost:6379
      EMAIL_VERIFICATION_ENABLED: true
      RESEND_API_KEY: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Install Dependencies
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run Tests
        run: uv run pytest -v
        working-directory: backend

  frontend-tests:
    if: |
      !(
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'docs')) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'docs')) ||
        (github.event_name == 'pull_request' && contains(github.event.head_commit.message, '[skip-tests]')) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip-tests]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: TESTING_KEY
      DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest
      EMAIL_VERIFICATION_ENABLED: true
      RESEND_API_KEY: test
      REDIS_URL: redis://localhost:6379
      ENABLE_TEST_ENDPOINTS: true
      TEST_ENDPOINT_KEY: A-TESTING-KEY
      RUN_INTEGRATION_TESTS: '1'
      RATELIMIT_AUTH_TIMES: 10000000
      RATELIMIT_AUTH_SECONDS: 60
      RATELIMIT_FORGOT_PASSWORD_TIMES: 10000000
      RATELIMIT_FORGOT_PASSWORD_SECONDS: 60
      RATELIMIT_GENERAL_TIMES: 10000000
      RATELIMIT_GENERAL_SECONDS: 60
      RATELIMIT_INGEST_TIMES: 10000000
      RATELIMIT_INGEST_SECONDS: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Install Backend Dependencies
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run DB Migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Start Backend
        run: |
          uv run fastapi dev main.py --host 0.0.0.0 --port 8000 &
          echo $! > $GITHUB_WORKSPACE/backend.pid
        working-directory: backend

      - name: Wait for Backend
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run Tests
        run: pnpm run test:all
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:8000
          WS_BASE_URL: ws://localhost:8000/ws
          APP_VERSION: testing

      - name: Run ESLint
        run: pnpm run lint --max-warnings=0
        working-directory: frontend