on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.14

      - name: Install Dependencies
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run Tests
        run: uv run pytest -v
        working-directory: backend
        env:
          SECRET_KEY: TESTING_KEY
          DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest

  checks:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Node.js Dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd frontend && pnpm run lint --max-warnings=0

  deploy-staging:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: Staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend to Dokploy Staging
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.DOKPLOY_DEPLOY_API }}" \
            --header "Content-Type: application/json" \
            --header "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
            --header "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}" \
            --header "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            --data '{
              "applicationId": "${{ secrets.DOKPLOY_STAGING_APP_ID }}"             
            }'

      - name: Deploy Frontend to Render Staging
        env:
          staging_frontend_deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_STAGING }}
        run: curl -X POST "$staging_frontend_deploy_url"

  deploy-production:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend to Coolify Prod
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.DOKPLOY_DEPLOY_API }}" \
            --header "Content-Type: application/json" \
            --header "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
            --header "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}" \
            --header "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            --data '{
              "applicationId": "${{ secrets.DOKPLOY_PROD_APP_ID }}"             
            }'

      - name: Deploy Frontend to Render Prod
        env:
          prod_frontend_deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_PROD }}
        run: curl -X POST "$prod_frontend_deploy_url"