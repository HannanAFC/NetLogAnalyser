on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.14

      - name: Install Dependencies
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run Tests
        run: uv run pytest -v
        working-directory: backend
        env:
          SECRET_KEY: TESTING_KEY
          DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest

  frontend-tests:
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.14

      - name: Install Backend Dependencies
        run: cd backend && uv sync --dev --frozen

      - name: Run DB migrations
        run: cd backend && uv run alembic upgrade head
        env:
          SECRET_KEY: TESTING_KEY
          DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest

      - name: Start backend for testing
        run: |
          cd backend
          uv run fastapi dev main.py --host 0.0.0.0 --port 8000 &
          echo $! > $GITHUB_WORKSPACE/backend.pid
        env:
          SECRET_KEY: TESTING_KEY
          DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest

      - name: Wait for backend to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Node.js Dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run vitest
        run: cd frontend && pnpm run test:all
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_WS_BASE_URL: ws://localhost:8001/ws

      - name: Run ESLint
        run: cd frontend && pnpm run lint --max-warnings=0

  deploy-staging:
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: Staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend to Coolify Staging
        env:
          deploy_url: ${{ secrets.COOLIFY_BACKEND_DEPLOY_HOOK_STAGING }}
          coolify_token: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -X GET "$deploy_url" \
            -H "Authorization: Bearer $coolify_token"

      - name: Deploy Frontend to Render Staging
        env:
          staging_frontend_deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_STAGING }}
        run: curl -X POST "$staging_frontend_deploy_url"

  deploy-production:
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend to Coolify Prod
        env:
          deploy_url: ${{ secrets.COOLIFY_BACKEND_DEPLOY_HOOK_PROD }}
          coolify_token: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -X GET "$deploy_url" \
            -H "Authorization: Bearer $coolify_token"

      - name: Deploy Frontend to Render Prod
        env:
          prod_frontend_deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_PROD }}
        run: curl -X POST "$prod_frontend_deploy_url"