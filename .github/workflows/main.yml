on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Node.js Dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd frontend && pnpm run lint --max-warnings=0

  deploy-staging:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: Staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend to Coolify Staging
        env:
          deploy_url: ${{ secrets.COOLIFY_BACKEND_DEPLOY_HOOK_STAGING }}
          coolify_token: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -X GET "$deploy_url" \
            -H "Authorization: Bearer $coolify_token"

      - name: Deploy Frontend to Render Staging
        env:
          staging_frontend_deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_STAGING }}
        run: curl -X POST "$staging_frontend_deploy_url"

  deploy-production:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend to Coolify Prod
        env:
          deploy_url: ${{ secrets.COOLIFY_BACKEND_DEPLOY_HOOK_PROD }}
          coolify_token: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -X GET "$deploy_url" \
            -H "Authorization: Bearer $coolify_token"

      - name: Deploy Frontend to Render Prod
        env:
          prod_frontend_deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_PROD }}
        run: curl -X POST "$prod_frontend_deploy_url"