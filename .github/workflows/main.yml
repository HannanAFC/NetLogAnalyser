on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**/*.md"

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    # Skip all tests when the PR title or commit message contains "docs"
    if: |
      !(
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'docs')) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'docs'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: TESTING_KEY
      DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.14

      - name: Install Dependencies
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run Tests
        run: uv run pytest -v
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: NetlogAnalyserUserTest
          POSTGRES_PASSWORD: TestPass
          POSTGRES_DB: NetLogAnalyserDBTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U NetlogAnalyserUserTest -d NetLogAnalyserDBTest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: TESTING_KEY
      DATABASE_URL: postgresql+psycopg://NetlogAnalyserUserTest:TestPass@localhost/NetLogAnalyserDBTest
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.14

      - name: Install Backend Dependencies
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run DB Migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Start Backend
        run: |
          uv run fastapi dev main.py --host 0.0.0.0 --port 8000 &
          echo $! > $GITHUB_WORKSPACE/backend.pid
        working-directory: backend

      - name: Wait for Backend
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run Tests
        run: pnpm run test:all
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_WS_BASE_URL: ws://localhost:8000/ws

      - name: Run ESLint
        run: pnpm run lint -- --max-warnings=0
        working-directory: frontend

  deploy-staging:
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: Staging
      url: ${{ vars.STAGING_URL }}
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend (Dokploy)
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.DOKPLOY_DEPLOY_API }}" \
            --header "Content-Type: application/json" \
            --header "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
            --header "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}" \
            --header "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            --data '{"applicationId": "${{ secrets.DOKPLOY_STAGING_APP_ID }}"}'

      - name: Deploy Frontend (Render)
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_STAGING }}
        run: curl -X POST "$RENDER_DEPLOY_URL"

  deploy-production:
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy Backend (Dokploy)
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.DOKPLOY_DEPLOY_API }}" \
            --header "Content-Type: application/json" \
            --header "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
            --header "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}" \
            --header "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            --data '{"applicationId": "${{ secrets.DOKPLOY_PROD_APP_ID }}"}'

      - name: Deploy Frontend (Render)
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_PROD }}
        run: curl -X POST "$RENDER_DEPLOY_URL"