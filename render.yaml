# Exported from Render on 2026-06-17T11:20:01Z
version: "1"
projects:
- name: NetLogAnalyser
  environments:
  - name: Production
    services:
    - type: web
      name: NetLogAnalyser Production
      runtime: static
      repo: https://github.com/HannanAFC/NetLogAnalyser
      envVars:
      - fromGroup: Production Environment
      buildCommand: pnpm install && pnpm run build
      staticPublishPath: dist
      domains:
      - netloganalyser.com
      - www.netloganalyser.com
      routes:
      - type: rewrite
        source: /*
        destination: /index.html
      autoDeployTrigger: "off"
      rootDir: frontend
      headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
  - name: Staging
    services:
    - type: web
      name: NetLogAnalyser Staging
      runtime: static
      repo: https://github.com/HannanAFC/NetLogAnalyser
      envVars:
      - fromGroup: Staging Environment
      buildCommand: pnpm install && pnpm run build
      staticPublishPath: dist
      routes:
      - type: rewrite
        source: /*
        destination: /index.html
      autoDeployTrigger: "off"
      rootDir: frontend
      headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains