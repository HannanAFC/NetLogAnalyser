version: "1"
services:
  - type: web
    name: NetLogAnalyser Production
    runtime: static
    repo: https://github.com/HannanAFC/NetLogAnalyser
    envVars:
      - fromGroup: Production Environment
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    domains:
      - netloganalyser.com
      - www.netloganalyser.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: "off"
    rootDir: frontend
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.netloganalyser.com ws://api.netloganalyser.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none';"

  - type: web
    name: NetLogAnalyser Staging
    runtime: static
    repo: https://github.com/HannanAFC/NetLogAnalyser
    envVars:
      - fromGroup: Staging Environment
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: "off"
    rootDir: frontend
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api-staging.netloganalyser.com ws://api-staging.netloganalyser.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none';"