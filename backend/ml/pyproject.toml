[project]
name = "nla-ml"
version = "0.1.0"
description = "Shared feature extraction for NetLogAnalyser's ML anomaly models. Used by both the backend and the Kaggle training notebooks."
readme = "README.md"
# Must run on Kaggle's notebook Python (3.13.15) as well as the backend's 3.14.
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
# The single scikit-learn pin, shared by the backend and the notebooks.
# Must equal nla_ml.compat.SKLEARN_VERSION (tested).
sklearn = [
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nla_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
