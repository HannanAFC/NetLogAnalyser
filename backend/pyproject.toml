[project]
name = "backend"
version = "0.0.0"
description = "Backend for NetLogAnalyser."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.1",
    "arq>=0.25.0",
    "boto3>=1.43.80",
    "fakeredis>=2.37.1",
    "fastapi-limiter>=0.2.0",
    "fastapi[standard]>=0.136.3",
    "geoip2>=5.3.0",
    "greenlet>=3.5.5",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "resend[async]>=2.33.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
