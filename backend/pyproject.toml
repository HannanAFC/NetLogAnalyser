[project]
name = "backend"
version = "0.0.0"
description = "Backend for NetLogAnalyser."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "arq==0.28.0",
    "boto3>=1.43.118",
    "fakeredis>=2.40.0",
    "fastapi-redis-sdk>=0.9.1",
    "fastapi[standard]==0.161.1",
    "geoip2>=5.3.0",
    "greenlet>=3.5.6",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "resend[async]>=2.49.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    "redis[hiredis]>=8.1.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
