[project]
name = "backend"
version = "0.0.0"
description = "Backend for NetLogAnalyser."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "arq==0.28.0",
    "boto3>=1.43.107",
    "fakeredis>=2.39.0",
    "fastapi-limiter>=0.2.0",
    "fastapi[standard]>=0.136.3",
    "geoip2>=5.3.0",
    "greenlet>=3.5.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "resend[async]>=2.49.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    "redis[hiredis]>=8.1.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
