[project]
name = "backend"
version = "0.0.0"
description = "Backend for NetLogAnalyser."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.1",
    "alembic>=1.18.4",
    "fastapi-limiter>=0.2.0",
    "fastapi[standard]>=0.136.3",
    "greenlet>=3.5.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "redis>=8.0.1",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
